services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: lovespace
      MYSQL_USER: lovespace
      MYSQL_PASSWORD: lovespace-local
      MYSQL_ROOT_PASSWORD: lovespace-root-local
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - lovespace-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plovespace-root-local"]
      interval: 5s
      timeout: 5s
      retries: 30

  s3mock:
    image: adobe/s3mock:5.1.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: lovespace
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - lovespace-s3:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lovespace-mysql:
  lovespace-s3:
